
spring.application.name=LoginRegexGoogle

# Servidor
server.port=8080

# SQL Server local
spring.datasource.url=jdbc:sqlserver://localhost:56952;databaseName=LoginRegexGoogle;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true;loginTimeout=10
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Introduce tu direccion real de Gmail
spring.mail.username=angeltonautiuht@gmail.com

# Introduce una NUEVA contraseña de aplicacion de Google
spring.mail.password=omhn hyxj shcp ytxh

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Tiempos de espera SMTP
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

